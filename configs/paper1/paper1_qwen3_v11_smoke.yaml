# Tiny smoke for v1.1 pipeline (NOT the full diagnostic).
# 2 tasks × 1 model × 1 prompt × 1 temp × 1 run = 2 cells
experiment_id: paper1_qwen3_v11_smoke
description: Smoke test for reasoning-model controls and raw response persistence
random_seed: 20260404
primary_metric: pass_at_1
evaluation_metrics:
- pass_at_1
- syntax_check
- token_count
providers:
  ollama_local:
    provider_type: ollama
    base_url: http://localhost:11434
    timeout_seconds: 300
models:
- id: qwen3_32b
  provider: ollama_local
  model_id: qwen3:32b
  think: false
  decoding:
    max_tokens: 1024
    top_p: 1.0
    think: false
prompt_variants:
- id: minimal
  template: 'Complete the following Python programming task.


    {input}


    Respond with exactly one Python code block using triple backticks (` ```python
    `). Do not include explanations, commentary, or text outside the code block.'
temperatures:
- 0.0
number_of_runs: 1
decoding:
  max_tokens: 1024
  top_p: 1.0
  think: false
tasks:
- id: task-humaneval_plus-001
  domain: executable_code_generation
  dataset: data/benchmarks/humaneval_plus.jsonl
  num_samples: 1
  metrics: [pass_at_1, syntax_check, token_count]
  extra:
    filter_task_id: humaneval-0
    execution: {timeout_seconds: 5.0, memory_mb: 512}
- id: task-humaneval_plus-002
  domain: executable_code_generation
  dataset: data/benchmarks/humaneval_plus.jsonl
  num_samples: 1
  metrics: [pass_at_1, syntax_check, token_count]
  extra:
    filter_task_id: humaneval-1
    execution: {timeout_seconds: 5.0, memory_mb: 512}
output:
  directory: ./outputs/paper1_qwen3_v11_smoke
  format: parquet
  save_raw_responses: true
  save_thinking_text: false
metadata:
  caliper_dataset_version: v1.1-smoke
  note: pipeline verification only
