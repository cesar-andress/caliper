# Ollama Paper 1 pilot — 6000 cells
# 6 models × 20 tasks × 5 prompts × 2 temperatures × 5 runs = 6000

experiment_id: paper1_ollama_pilot
description: >
  Paper 1 local-model pilot using Ollama for variance decomposition with six code models.

random_seed: 20260404

providers:
  ollama_local:
    provider_type: ollama
    base_url: http://localhost:11434
    timeout_seconds: 300

models:
  - id: qwen25_coder_7b
    provider: ollama_local
    model_id: qwen2.5-coder:7b
  - id: qwen25_coder_14b
    provider: ollama_local
    model_id: qwen2.5-coder:14b
  - id: qwen25_coder_32b
    provider: ollama_local
    model_id: qwen2.5-coder:32b
  - id: deepseek_coder_v2_lite
    provider: ollama_local
    model_id: deepseek-coder-v2:lite
  - id: llama31_8b
    provider: ollama_local
    model_id: llama3.1:8b
  - id: qwen3_32b
    provider: ollama_local
    model_id: qwen3:32b

prompt_variants:
  - id: direct
    template: "{input}\n\nAnswer with Python code only:"
  - id: concise
    template: "Briefly solve the task.\n\n{input}\n\nCode:"
  - id: step_by_step
    template: "Think step by step, then write code.\n\n{input}\n\nSolution:"
  - id: test_aware
    template: "Write Python code that should pass unit tests.\n\n{input}\n\nCode:"
  - id: production_quality
    template: "Write production-quality, readable Python.\n\n{input}\n\nAnswer:"

tasks:
  - id: task-pilot-001
    domain: code_generation
    dataset: data/paper1/pilot_code_tasks.jsonl
    num_samples: 1
    metrics:
      - exact_match
      - normalized_code_match
      - syntax_check
      - test_pass_rate
    extra:
