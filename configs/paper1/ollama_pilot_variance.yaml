temperatures:
  - 0.0
  - 0.7

decoding:
  top_p: 1.0
  max_tokens: 256

evaluation_metrics:
  - exact_match
  - normalized_code_match
  - syntax_check
  - test_pass_rate

primary_metric: normalized_code_match

number_of_runs: 5

output:
  directory: ./outputs
  format: parquet
  save_raw_responses: true

logging:
  level: INFO
  log_to_file: true
  log_format: json

execution:
  shuffle: false
  parallel_workers: 1

metadata:
  paper: paper1
  design: "6x20x5x2x5 ollama pilot (6000 cells)"
  purpose: ollama_pilot
