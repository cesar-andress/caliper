# Paper 1 pilot — variance decomposition under mock model tiers
# Usage:
#   caliper plan --config configs/paper1/pilot_variance_decomposition.yaml
#   caliper run  --config configs/paper1/pilot_variance_decomposition.yaml
#
# Factorial: 3 models × 20 tasks × 5 prompts × 2 temperatures × 10 runs = 6000 cells

experiment_id: paper1_pilot_variance
description: >
  Paper 1 mock pilot for variance decomposition and power analysis.
  Uses three simulated model quality tiers over 600 factorial cells.

random_seed: 20260404

providers:
  mock_strong:
    type: mock
    extra:
      match_rate: 0.85
      simulated_latency_ms: 0
  mock_medium:
    type: mock
    extra:
      match_rate: 0.55
      simulated_latency_ms: 0
  mock_noisy:
    type: random
    extra:
      match_rate: 0.25
      simulated_latency_ms: 0

models:
  - id: mock_strong
    provider: mock_strong
    model_id: mock-strong-v1
  - id: mock_medium
    provider: mock_medium
    model_id: mock-medium-v1
  - id: mock_noisy
    provider: mock_noisy
    model_id: mock-noisy-v1

prompt_variants:
  - id: direct
    template: "{input}\n\nAnswer with Python code only:"
  - id: concise
    template: "Briefly solve the task.\n\n{input}\n\nCode:"
  - id: step_by_step
    template: "Think step by step, then write code.\n\n{input}\n\nSolution:"
  - id: test_aware
    template: "Write Python code that should pass unit tests.\n\n{input}\n\nCode:"
  - id: production_quality
    template: "Write production-quality, readable Python.\n\n{input}\n\nAnswer:"

tasks:
  - id: task-pilot-001
    domain: code_generation
    dataset: data/paper1/pilot_code_tasks.jsonl
    num_samples: 1
    metrics:
      - exact_match
    extra:
      filter_task_id: pilot-001
