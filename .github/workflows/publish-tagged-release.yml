name: Publish tagged GitHub Release

on:
  push:
    tags:
      - 'v1.1.0'
      - 'v1.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          NOTES="CALIPER ${TAG}. POST-FREEZE DIAGNOSTIC EVIDENCE: artifacts/paper1/qwen3_postfreeze_diagnostics/. Confirmatory freeze SHA-256 95209fff2f742d59b52aa5cf5616f1395ef7fc01fd87fe025c485577bca0d1c9 unchanged. Does not rewrite v1.0.0."
          if [ -f artifacts/paper1/qwen3_postfreeze_diagnostics.zip ]; then
            gh release create "$TAG" artifacts/paper1/qwen3_postfreeze_diagnostics.zip \
              --title "CALIPER ${TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" --title "CALIPER ${TAG}" --notes "$NOTES"
          fi
