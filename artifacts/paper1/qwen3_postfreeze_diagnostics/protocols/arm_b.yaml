  tasks/prompts/temps/runs/seeds to v1.0'
random_seed: 20260404
primary_metric: pass_at_1
evaluation_metrics:
- pass_at_1
- syntax_check
- normalized_code_match
- execution_latency_ms
- token_count
providers:
  ollama_local:
    provider_type: ollama
    base_url: http://localhost:11434
    timeout_seconds: 1200
models:
- id: qwen3_32b
  provider: ollama_local
  model_id: qwen3:32b
  think: 'true'
  decoding:
    max_tokens: 4096
    top_p: 1.0
    think: 'true'
prompt_variants:
- id: minimal
  template: 'Complete the following Python programming task.


    {input}


    Respond with exactly one Python code block using triple backticks (` ```python
    `). Do not include explanations, commentary, or text outside the code block.'
- id: explicit_reasoning
  template: 'Solve the following Python programming task. You may reason internally,
    but your response must contain only code in the required format.


    {input}


    Respond with exactly one Python code block using triple backticks (` ```python
    `). Do not include explanations, commentary, or text outside the code block.'
- id: testing_oriented
  template: 'Write Python code for the following task so that it passes hidden unit
    tests.


    {input}


    Respond with exactly one Python code block using triple backticks (` ```python
    `). Do not include explanations, commentary, or text outside the code block.'
- id: professional
  template: 'As a professional Python developer, implement the following task with
    clear, maintainable code.


    {input}


    Respond with exactly one Python code block using triple backticks (` ```python
    `). Do not include explanations, commentary, or text outside the code block.'
