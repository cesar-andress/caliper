[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caliper"
version = "0.1.0"
description = "Reproducible research artifact for variance, statistical power, and ranking fragility in LLM evaluations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "CALIPER Team" },
]
keywords = ["llm", "evaluation", "statistics", "variance", "benchmarks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
api = [
    "openai>=1.30",
    "anthropic>=0.34",
    "google-genai>=1.0",
]
local = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.29",
    "bitsandbytes>=0.43; platform_system=='Linux'",
    "sentencepiece>=0.2",
]
local-llama-cpp = [
    "llama-cpp-python>=0.2.90",
]
local-vllm = [
    "vllm>=0.4; platform_system=='Linux'",
]
local-nvml = [
    "pynvml>=11.5",
]
benchmarks = [
    "evalplus>=0.2.2",
    "datasets>=2.18",
]
local-all = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.29",
    "bitsandbytes>=0.43; platform_system=='Linux'",
    "sentencepiece>=0.2",
    "llama-cpp-python>=0.2.90",
    "vllm>=0.4; platform_system=='Linux'",
    "pynvml>=11.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.scripts]
caliper = "caliper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["caliper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -m 'not integration and not local'"
markers = [
    "integration: live API integration tests (require API keys)",
    "local: live local model tests (require model path and GPU deps)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["caliper"]
omit = ["tests/*"]
